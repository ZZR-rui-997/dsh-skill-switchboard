<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Skills workbench: a sidebar panel listing skills with enable switches, search and spec check marks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#eaf1fe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#4f9bff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" rx="0" fill="url(#bg)"/>

  <!-- sidebar panel -->
  <rect x="32" y="32" width="392" height="236" rx="14" fill="url(#card)" stroke="#cfdcf7" stroke-width="1.5"/>

  <!-- panel header -->
  <text x="52" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2740">Skills</text>
  <rect x="300" y="48" width="60" height="20" rx="10" fill="#eef4ff" stroke="#cfdcf7" stroke-width="1"/>
  <text x="330" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2f6df6" text-anchor="middle">18 total</text>
  <rect x="368" y="48" width="34" height="20" rx="10" fill="url(#accent)"/>
  <text x="385" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">New</text>

  <!-- search box -->
  <rect x="52" y="76" width="350" height="26" rx="8" fill="#f5f8ff" stroke="#dbe6fb" stroke-width="1"/>
  <circle cx="66" cy="89" r="4.5" fill="none" stroke="#7d90b3" stroke-width="1.4"/>
  <line x1="69.5" y1="92.5" x2="73" y2="96" stroke="#7d90b3" stroke-width="1.4" stroke-linecap="round"/>
  <text x="82" y="93" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#8fa1bf">Search skills (name / description / body)…</text>

  <!-- chip row -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">
    <rect x="52" y="110" width="34" height="18" rx="9" fill="url(#accent)"/>
    <text x="69" y="123" fill="#ffffff" text-anchor="middle">All</text>
    <rect x="92" y="110" width="52" height="18" rx="9" fill="#eef4ff" stroke="#cfdcf7"/>
    <text x="118" y="123" fill="#2f6df6" text-anchor="middle">Enabled</text>
    <rect x="150" y="110" width="58" height="18" rx="9" fill="#f5f8ff" stroke="#dbe6fb"/>
    <text x="179" y="123" fill="#6d7f9e" text-anchor="middle">Disabled</text>
    <rect x="214" y="110" width="40" height="18" rx="9" fill="#f5f8ff" stroke="#dbe6fb"/>
    <text x="234" y="123" fill="#6d7f9e" text-anchor="middle">Issues</text>
    <rect x="260" y="110" width="42" height="18" rx="9" fill="#f5f8ff" stroke="#dbe6fb"/>
    <text x="281" y="123" fill="#6d7f9e" text-anchor="middle">Linked</text>
  </g>

  <!-- skill rows -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- row 1: enabled -->
    <rect x="52" y="138" width="350" height="34" rx="9" fill="#ffffff" stroke="#e2ebfb" stroke-width="1"/>
    <circle cx="68" cy="155" r="5" fill="#2f6df6"/>
    <text x="82" y="152" font-size="10.5" font-weight="600" fill="#1b2740">thesis-writing-ops</text>
    <text x="82" y="164" font-size="8.5" fill="#8fa1bf">Chinese thesis writing rules + check_writing.py</text>
    <circle cx="316" cy="155" r="4" fill="#2ec27e"/>
    <rect x="345" y="147" width="34" height="16" rx="8" fill="url(#accent)"/>
    <circle cx="371" cy="155" r="5.5" fill="#ffffff"/>

    <!-- row 2: enabled, spec ok -->
    <rect x="52" y="178" width="350" height="34" rx="9" fill="#ffffff" stroke="#e2ebfb" stroke-width="1"/>
    <circle cx="68" cy="195" r="5" fill="#4f9bff"/>
    <text x="82" y="192" font-size="10.5" font-weight="600" fill="#1b2740">fluent-pyfluent-ops</text>
    <text x="82" y="204" font-size="8.5" fill="#8fa1bf">PyFluent runbook: VOF, UDF, Windows traps</text>
    <circle cx="316" cy="195" r="4" fill="#2ec27e"/>
    <rect x="345" y="187" width="34" height="16" rx="8" fill="url(#accent)"/>
    <circle cx="371" cy="195" r="5.5" fill="#ffffff"/>

    <!-- row 3: disabled -->
    <rect x="52" y="218" width="350" height="34" rx="9" fill="#fafcff" stroke="#e6edfa" stroke-width="1"/>
    <circle cx="68" cy="235" r="5" fill="#c6d3ea"/>
    <text x="82" y="232" font-size="10.5" font-weight="600" fill="#7d90b3">scratch-notes</text>
    <text x="82" y="244" font-size="8.5" fill="#a8b6cf">disabled — hidden from the model and from /skills</text>
    <circle cx="316" cy="235" r="4" fill="#e8b23a"/>
    <rect x="345" y="227" width="34" height="16" rx="8" fill="#e4ebf7"/>
    <circle cx="353" cy="235" r="5.5" fill="#ffffff"/>
  </g>

  <!-- right side: what the panel writes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="448" y="56" width="160" height="188" rx="12" fill="url(#card)" stroke="#cfdcf7" stroke-width="1.5"/>
    <text x="466" y="82" font-size="11" font-weight="600" fill="#1b2740">SKILL.md</text>
    <text x="466" y="96" font-size="8.5" fill="#8fa1bf">frontmatter, written back</text>

    <rect x="466" y="108" width="124" height="86" rx="7" fill="#f5f8ff" stroke="#dbe6fb"/>
    <g font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#43557a">
      <text x="474" y="124">name: thesis-writing-ops</text>
      <text x="474" y="137">description: …</text>
      <text x="474" y="150">metadata:</text>
      <text x="482" y="163">version: 1.0.3</text>
      <text x="474" y="176" fill="#2f6df6">disable-model-invocation: false</text>
      <text x="474" y="189" fill="#2f6df6">user-invocable: true</text>
    </g>

    <rect x="466" y="204" width="124" height="24" rx="7" fill="#eaf7f0" stroke="#bfe6d1"/>
    <text x="528" y="220" font-size="9" fill="#1c7d52" text-anchor="middle">reloaded, no restart</text>
  </g>

  <!-- footer labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8fa1bf">
    <text x="32" y="288">check · fix · edit · create · import (.zip) · move · tag · trash</text>
    <text x="608" y="288" text-anchor="end">dsh-skill-switchboard</text>
  </g>
</svg>